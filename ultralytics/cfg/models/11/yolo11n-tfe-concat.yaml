# YOLO11n + progressive TFE (concat control). P3/P4/P5 detection; no P2 detection head.
# Input ordering at each TFE: high, middle, low spatial resolution.
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 P2
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 P3
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 6 P4
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]] # 10 P5

head:
  - [[4, 6, 10], 1, AdaptiveTFE, [512, 8, concat]] # 11 -> P4 size
  - [-1, 2, C3k2, [512, False]] # 12 F4
  - [[2, 4, 12], 1, AdaptiveTFE, [256, 8, concat]] # 13 -> P3 size
  - [-1, 2, C3k2, [256, False]] # 14 P3 output
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 17 P4 output
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 20 P5 output
  - [[14, 17, 20], 1, Detect, [nc]]
