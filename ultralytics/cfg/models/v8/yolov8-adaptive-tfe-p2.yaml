# Experimental TFE + ASFF-style spatial weighting, NOT a full SAIR-YOLO reproduction.
# Two TFE nodes replace the P4/P3 top-down fusion. PAN/P2 concat remains unchanged.
# To ablate: change BOTH 'adaptive' arguments to 'mean' or 'concat'.
nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]] # 2 P2
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]] # 4 P3
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]] # 6 P4
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9 P5

head:
  - [[4, 6, 9], 1, AdaptiveTFE, [512, 8, adaptive]] # 10 -> P4 size
  - [-1, 3, C2f, [512]] # 11 F4
  - [[2, 4, 11], 1, AdaptiveTFE, [256, 8, adaptive]] # 12 -> P3 size
  - [-1, 3, C2f, [256]] # 13 F3
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C2f, [128]] # 16 P2 output
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [256]] # 19 P3 output
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # 22 P4 output
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]] # 25 P5 output
  - [[16, 19, 22, 25], 1, Detect, [nc]]
